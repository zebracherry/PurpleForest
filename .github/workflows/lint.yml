name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install yamllint ansible-lint "ansible-core>=2.17"

      - name: Install collections the playbooks reference
        run: |
          ansible-galaxy collection install \
            ansible.windows community.windows microsoft.ad \
            community.general community.docker

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        working-directory: ansible
        run: ansible-lint

      - name: Playbook syntax check
        working-directory: ansible
        run: ansible-playbook site.yml --syntax-check

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck lab.sh scripts/*.sh

      - name: Vagrantfile syntax
        run: |
          sudo apt-get install -y ruby
          ruby -c Vagrantfile
