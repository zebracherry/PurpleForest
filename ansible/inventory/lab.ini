; Run from the KALI guest, which sits on the 10.10.10.0/24 lab network.

[domain_controllers]
dc01 ansible_host=10.10.10.10

[workstations]
ws01 ansible_host=10.10.10.20

[siem]
siem01 ansible_host=10.10.10.30

[windows:children]
domain_controllers
workstations

[windows:vars]
ansible_user=vagrant
ansible_password=vagrant
ansible_connection=winrm
ansible_winrm_transport=basic
ansible_winrm_server_cert_validation=ignore
ansible_port=5985

[siem:vars]
ansible_user=vagrant
ansible_password=vagrant
ansible_connection=ssh
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
ansible_become=true
