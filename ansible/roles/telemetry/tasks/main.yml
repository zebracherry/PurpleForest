---
# --------------------------------------------------------------- Sysmon ----

- name: Create the telemetry directory
  ansible.windows.win_file:
    path: C:\lab\telemetry
    state: directory

- name: Download Sysmon
  ansible.windows.win_get_url:
    url: https://download.sysinternals.com/files/Sysmon.zip
    dest: C:\lab\telemetry\Sysmon.zip

- name: Extract Sysmon
  community.windows.win_unzip:
    src: C:\lab\telemetry\Sysmon.zip
    dest: C:\lab\telemetry\sysmon
    creates: C:\lab\telemetry\sysmon\Sysmon64.exe

- name: Download the Sysmon config
  ansible.windows.win_get_url:
    url: "{{ sysmon_config_url }}"
    dest: C:\lab\telemetry\sysmonconfig.xml

- name: Check whether Sysmon is already installed
  ansible.windows.win_service_info:
    name: Sysmon64
  register: telemetry_sysmon_svc
  failed_when: false

- name: Install Sysmon
  ansible.windows.win_shell: |
    C:\lab\telemetry\sysmon\Sysmon64.exe -accepteula -i C:\lab\telemetry\sysmonconfig.xml
  when: not (telemetry_sysmon_svc.services | default([]) | length > 0)

- name: Update the Sysmon config if it is already installed
  ansible.windows.win_shell: |
    C:\lab\telemetry\sysmon\Sysmon64.exe -c C:\lab\telemetry\sysmonconfig.xml
  when: telemetry_sysmon_svc.services | default([]) | length > 0
  changed_when: true

# --------------------------------------------------------------- Vector ----

- name: Download the Vector MSI
  ansible.windows.win_get_url:
    url: "https://github.com/vectordotdev/vector/releases/download/v{{ vector_version }}/vector-{{ vector_version }}-x64.msi"
    dest: "C:\\lab\\telemetry\\vector-{{ vector_version }}.msi"

- name: Install Vector
  ansible.windows.win_package:
    path: "C:\\lab\\telemetry\\vector-{{ vector_version }}.msi"
    state: present
    arguments: /quiet

- name: Create the Vector data directory
  ansible.windows.win_file:
    path: C:\ProgramData\vector
    state: directory

- name: Deploy the Vector config
  ansible.windows.win_template:
    src: vector.yaml.j2
    dest: 'C:\Program Files\Vector\config\vector.yaml'
  notify: Restart vector

- name: Validate the Vector config before trusting it
  # Fail loudly here rather than silently shipping nothing.
  ansible.windows.win_shell: |
    & 'C:\Program Files\Vector\bin\vector.exe' validate --no-environment `
      --config-yaml 'C:\Program Files\Vector\config\vector.yaml'
  register: telemetry_vector_validate
  changed_when: false
  failed_when: telemetry_vector_validate.rc != 0

- name: Register Vector as a Windows service
  # The MSI installs the binary only; the service is a separate step.
  ansible.windows.win_powershell:
    script: |
      if (Get-Service -Name vector -ErrorAction SilentlyContinue) {
        $Ansible.Changed = $false
        return
      }
      & 'C:\Program Files\Vector\bin\vector.exe' service install `
        --config-yaml 'C:\Program Files\Vector\config\vector.yaml'
      if ($LASTEXITCODE -ne 0) { throw "vector service install exited $LASTEXITCODE" }
      $Ansible.Changed = $true

- name: Ensure Vector runs as a service and starts at boot
  ansible.windows.win_service:
    name: vector
    start_mode: auto
    state: started
