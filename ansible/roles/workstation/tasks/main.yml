---
- name: Point DNS at the domain controller
  # Without this the domain join fails with an unhelpful error.
  ansible.windows.win_dns_client:
    adapter_names: "*"
    dns_servers:
      - "{{ dc_ip }}"

- name: Wait until the DC answers as a domain controller
  ansible.windows.win_shell: |
    Resolve-DnsName -Name _ldap._tcp.dc._msdcs.{{ domain_name }} -Type SRV
  register: dcsrv
  until: dcsrv.rc == 0
  retries: 30
  delay: 20
  changed_when: false

- name: Join the domain
  microsoft.ad.membership:
    dns_domain_name: "{{ domain_name }}"
    domain_admin_user: "{{ domain_netbios }}\\Administrator"
    domain_admin_password: "{{ domain_admin_password }}"
    state: domain
    reboot: true

- name: Add a domain user to the local Administrators group
  # Gives you a realistic foothold account for lateral movement exercises.
  ansible.windows.win_group_membership:
    name: Administrators
    members:
      - "{{ domain_netbios }}\\jhelpdesk"
    state: present
  when: misconfig_acl_genericall | bool or misconfig_password_in_desc | bool

- name: Mirror the DC's audit policy on the workstation
  ansible.windows.win_shell: |
    auditpol /set /subcategory:"Logon" /success:enable /failure:enable
    auditpol /set /subcategory:"Process Creation" /success:enable
    auditpol /set /subcategory:"Credential Validation" /success:enable /failure:enable
  changed_when: true

- name: Include the command line in process creation events (4688)
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit
    name: ProcessCreationIncludeCmdLine_Enabled
    data: 1
    type: dword

- name: Enable PowerShell script block logging
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging
    name: EnableScriptBlockLogging
    data: 1
    type: dword

- name: Disable SMB signing (relay exercises)
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters
    name: requiresecuritysignature
    data: 0
    type: dword
  when: misconfig_smb_signing_off | bool
